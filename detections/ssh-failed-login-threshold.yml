title: SSH High-Volume Failed Logins by Source/Destination Pair
id: 7f3a1e2c-4b6d-4a9f-9c1e-2d5f8a7b3c10
status: experimental
description: >
  Detects a single source generating an unusually high number of failed
  SSH authentication attempts against a single destination - a brute-force
  signature. Threshold (>5) chosen from observed baseline in MACCDC 2012
  capture, where legitimate hosts showed near-zero failures per pair.
references:
  - https://github.com/sumitjha7727/splunk-log-analysis/tree/main/04-ssh-log-analysis
author: Sumit Kant Jha
date: 2026-08-28
logsource:
  category: application
  product: zeek
  service: ssh
detection:
  selection:
    status: failure
  timeframe: 1h
  condition: selection | count() by src_ip, dest_ip > 5
falsepositives:
  - Misconfigured automated jobs or monitoring tools retrying SSH connections
  - A legitimate user repeatedly mistyping credentials
level: medium
tags:
  - attack.credential_access
  - attack.t1110