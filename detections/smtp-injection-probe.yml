title: SMTP Command-Injection Probe in Envelope Fields
id: be361f25-a236-4911-9fd3-eb2b96148fb7
status: experimental
description: >
  Detects command-injection-style shell metacharacters (pipe, semicolon,
  or embedded quote) in the SMTP RCPT TO or MAIL FROM envelope fields -
  a classic blind shell/command-injection probe testing whether a mail
  relay passes the recipient address to a shell. Confirmed in Project 6
  (Query 4): 11 events with rcptto set to root+:"|sleep 5 #" and
  mailfrom spoofed as <root@[source-ip]>; 7 of 11 destinations returned
  250 Ok, accepting the malformed address without rejecting it.
references:
  - https://github.com/sumitjha7727/splunk-log-analysis/tree/main/06-smtp-log-analysis
author: Sumit Kant Jha
date: 2026-08-28
logsource:
  category: application
  product: zeek
  service: smtp
detection:
  selection_rcptto:
    rcptto|contains:
      - '|'
      - ';'
      - '"'
  selection_mailfrom:
    mailfrom|contains:
      - '|'
      - ';'
  condition: 1 of selection_*
falsepositives:
  - A legitimate email address or display name that happens to contain a semicolon or quote character (rare, but technically valid in some address formats)
level: high
tags:
  - attack.initial_access
  - attack.t1190