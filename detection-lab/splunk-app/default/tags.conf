# tags.conf — CIM data-model tagging for the three sourcetypes A5
# named explicitly: DNS -> Network Resolution, tunnel -> Network
# Traffic, SSH -> Authentication. Field-level CIM normalization
# (src_ip -> src, dest_ip -> dest) lives in props.conf's
# FIELDALIAS-cim on all six sourcetypes; this file is only the
# data-model classification layer on top of that.

[eventtype=dns_activity]
Network_Resolution = enabled

[eventtype=tunnel_activity]
Network_Traffic = enabled

[eventtype=ssh_activity]
Authentication = enabled
