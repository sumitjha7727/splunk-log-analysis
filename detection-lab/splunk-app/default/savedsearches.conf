# savedsearches.conf — generated from the Sigma rules in
# 07-detection-as-code/ and their hand-translated SPL as documented in
# 07-detection-as-code/README.md. DO NOT HAND-EDIT THIS FILE. If a
# detection's SPL, schedule, or threshold changes, change it in the
# Sigma rule and the corresponding README section first, then
# regenerate this file to match - otherwise this file and the
# documentation it's supposed to implement will silently drift apart,
# which is exactly the bug A1 fixed for the search-window mismatch.
#
# Six stanzas below for six documented detections (07-detection-as-code
# now has six Sigma rules, not the five A5 originally scoped this file
# for - included here for consistency so this file matches the current
# state of that folder rather than a stale subset).

[SSH Brute Force Followed by Success]
search = index=main sourcetype="ssh_sample" earliest=-1h latest=now | stats count(eval(status="failure")) as failures, count(eval(status="success")) as successes by src_ip, dest_ip | where failures > 5 AND successes > 0 | sort -failures
description = Sigma: ssh-bruteforce-then-success.yml. Fires when a source/destination pair exceeds 5 failed SSH logins followed by a success, within the same 1-hour window as the correlation rule's declared timespan.
is_scheduled = 1
enableSched = 1
cron_schedule = 0 * * * *
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 4
alert.suppress = 1
alert.suppress.period = 86400
alert.suppress.fields = src_ip,dest_ip
alert.track = 1
actions =
disabled = 0

[SMTP Nmap Scan Signature (HELO Fingerprint)]
search = index=main sourcetype="smtp_sample" earliest=-1h latest=now helo="*nmap*"
description = Sigma: nmap-scan-signature.yml. Fires on Nmap's SMTP script HELO fingerprint (nmap.scanme.org). No correlation window to match; hourly is a reasonable default cadence.
is_scheduled = 1
enableSched = 1
cron_schedule = 0 * * * *
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 3
alert.track = 1
actions =
disabled = 0

[SMTP Nessus Scan Signature (HELO Fingerprint)]
