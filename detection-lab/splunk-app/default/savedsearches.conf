[SMTP Command-Injection Probe in Envelope Fields]
search = index=main sourcetype="smtp_sample" earliest=0 (rcptto="*|*" OR rcptto="*;*" OR rcptto="*\"*" OR mailfrom="*|*" OR mailfrom="*;*")
description = Sigma: smtp-injection-probe.yml. Documented finding, not yet a live alert - the underlying finding was a fixed set of 11 events in a static capture, nothing left for a schedule to catch going forward. See 07-detection-as-code/README.md, detection 4.
is_scheduled = 0
enableSched = 0
disabled = 1
actions =

[DHCP Lease Pool Dominated by a Single Host]
search = index=main sourcetype="dhcp_sample" earliest=0 | stats count by mac | where count > 20
description = Sigma: dhcp-lease-anomaly.yml. Informational only, deliberately unscheduled - threshold (>20) is calibrated against Splunk's own undercounted view of this sourcetype pending re-verification after the props.conf line-breaking fix (see RUNBOOK.md). See 07-detection-as-code/README.md, detection 5.
is_scheduled = 0
enableSched = 0
disabled = 1
actions =

[DNS Tunneling via High-Cardinality Subdomains]
search = index=main sourcetype="dns_sample" earliest=0 | rex field=query "(?<subdomain>^[^.]+)\.(?<parent_domain>.+)$" | eval subdomain_length=len(subdomain) | stats dc(query) as unique_subdomains, avg(subdomain_length) as mean_subdomain_length, count as total_queries by src_ip, parent_domain | where unique_subdomains > 15 AND mean_subdomain_length > 35
description = Sigma: dns-tunneling-high-cardinality.yml. Pending investigation results - thresholds (15, 35) are placeholders, not yet validated. See RUNBOOK.md, 01-dns-log-analysis/investigation/INVESTIGATION.md, and 07-detection-as-code/README.md detection 6.
is_scheduled = 0
enableSched = 0
disabled = 1
actions =
