# eventtypes.conf — one eventtype per sourcetype, used as the tagging
# anchor for the CIM mappings in tags.conf. Scoped to the three
# sourcetypes A5 named for CIM data-model tagging (DNS -> Network
# Resolution, tunnel -> Network Traffic, SSH -> Authentication); the
# other three sourcetypes still get the src_ip/dest_ip -> src/dest
# field aliasing in props.conf, just not a CIM data-model tag yet.

[dns_activity]
search = sourcetype=dns_sample

[tunnel_activity]
search = sourcetype=tunnel_sample

[ssh_activity]
search = sourcetype=ssh_sample
