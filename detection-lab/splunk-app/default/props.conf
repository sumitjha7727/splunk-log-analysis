# props.conf — per-sourcetype parsing rules for this app's six
# sourcetypes. Every stanza fixes the same root-cause issue flagged
# as a "known limitation" across Projects 1, 3, 4, 5, and 6: Splunk's
# classic Add Data wizard never recognized the Zeek epoch `ts` field
# (e.g. "1331901011.840000") as a real timestamp, so `_time` fell back
# to ingestion time - and, on two projects (Tunnel, DHCP), the missing
# timestamp anchor also broke line-breaking, merging multiple real
# records into single indexed events. Project 3's README calls this
# out directly: "In a production Splunk deployment this would be
# fixed with an explicit TIME_FORMAT/TIME_PREFIX in props.conf for
# the sourcetype." This file is that fix, applied for real.
#
# TIME_PREFIX/TIME_FORMAT/LINE_BREAKER are applied to all six
# sourcetypes, since the root cause (an epoch `ts` field Splunk can't
# auto-detect) is documented across all of them, not only DHCP - A5
# specifically asked for the DHCP line-breaking fix, called out below
# where it lives; the same fix is extended to the other five for
# consistency, since leaving them on the old undocumented-timestamp
# behavior while only fixing DHCP would reintroduce the identical bug
# class anywhere Splunk's line-breaking heuristic guesses wrong again.

[dns_sample]
TIME_PREFIX = ^
TIME_FORMAT = %s.%6N
MAX_TIMESTAMP_LOOKAHEAD = 20
LINE_BREAKER = ([\r\n]+)(?=\d{9,10}\.\d+\t)
SHOULD_LINEMERGE = false
TRANSFORMS-nullqueue = null_queue_comment_lines
REPORT-dns_fields = dns_sample_fields
FIELDALIAS-cim = src_ip AS src dest_ip AS dest
# Network_Resolution CIM tagging lives in tags.conf via [eventtype=dns_activity].

[ftp_sample]
TIME_PREFIX = ^
TIME_FORMAT = %s.%6N
MAX_TIMESTAMP_LOOKAHEAD = 20
LINE_BREAKER = ([\r\n]+)(?=\d{9,10}\.\d+\t)
SHOULD_LINEMERGE = false
TRANSFORMS-nullqueue = null_queue_comment_lines
REPORT-ftp_fields = ftp_sample_fields
FIELDALIAS-cim = src_ip AS src dest_ip AS dest
# No CIM data-model tag applied here — out of A5's explicitly named
# scope (Network Resolution/DNS, Network Traffic/conn+tunnel,
# Authentication/SSH only). Left as a natural follow-up, not silently
# declared done.

[ssh_sample]
TIME_PREFIX = ^
TIME_FORMAT = %s.%6N
MAX_TIMESTAMP_LOOKAHEAD = 20
LINE_BREAKER = ([\r\n]+)(?=\d{9,10}\.\d+\t)
SHOULD_LINEMERGE = false
TRANSFORMS-nullqueue = null_queue_comment_lines
REPORT-ssh_fields = ssh_sample_fields
FIELDALIAS-cim = src_ip AS src dest_ip AS dest
# Authentication CIM tagging lives in tags.conf via [eventtype=ssh_activity].

[tunnel_sample]
TIME_PREFIX = ^
TIME_FORMAT = %s.%6N
MAX_TIMESTAMP_LOOKAHEAD = 20
# Fixes the same class of header/footer line-breaking bug documented
# in 04-tunnel-log-analysis/README.md (Bug #2): Splunk's default
# line-breaking merged 8 header lines into one bogus event and glued
# a trailing #close line onto the last real record, corrupting its
# action field and causing the "tunnels that never closed" query to
# silently under-report. LINE_BREAKER below anchors a new event
# strictly to a line that starts with a real Unix-epoch timestamp
# followed by a tab, so header/footer lines can no longer be mistaken
# for event boundaries or merged onto real ones.
LINE_BREAKER = ([\r\n]+)(?=\d{9,10}\.\d+\t)
SHOULD_LINEMERGE = false
TRANSFORMS-nullqueue = null_queue_comment_lines
REPORT-tunnel_fields = tunnel_sample_fields
FIELDALIAS-cim = src_ip AS src dest_ip AS dest
# Network_Traffic CIM tagging lives in tags.conf via [eventtype=tunnel_activity].

[smtp_sample]
TIME_PREFIX = ^
TIME_FORMAT = %s.%6N
MAX_TIMESTAMP_LOOKAHEAD = 20
LINE_BREAKER = ([\r\n]+)(?=\d{9,10}\.\d+\t)
SHOULD_LINEMERGE = false
TRANSFORMS-nullqueue = null_queue_comment_lines
REPORT-smtp_fields = smtp_sample_fields
FIELDALIAS-cim = src_ip AS src dest_ip AS dest
# No CIM data-model tag applied here — out of A5's explicitly named scope (see ftp_sample note above).

[dhcp_sample]
TIME_PREFIX = ^
TIME_FORMAT = %s.%6N
MAX_TIMESTAMP_LOOKAHEAD = 20
# Fixes Project 6's severe line-breaking bug, the single most
# significant data-quality issue found across this whole project
# series (see 06-dhcp-log-analysis/README.md, Known limitation):
# Splunk's default line-breaking couldn't reliably detect the Zeek
# epoch `ts` as a real timestamp, so it fell back to a heuristic that
# glued multiple real DHCP records into single indexed events -
# undercounting the true top host's 744 real requests down to just 41
# visible in Splunk (1,502 real records total vs. 333 indexed events).
# LINE_BREAKER below anchors a new event strictly to a line starting
# with a real Unix-epoch timestamp followed by a tab, so merged
# multi-record events can no longer occur. RUNBOOK.md has a
# verification step to re-run the counts after this fix is deployed
# and confirm they now match the raw-file cross-check (744/1,502, not
# 41/333).
LINE_BREAKER = ([\r\n]+)(?=\d{9,10}\.\d+\t)
SHOULD_LINEMERGE = false
TRANSFORMS-nullqueue = null_queue_comment_lines
REPORT-dhcp_fields = dhcp_sample_fields
FIELDALIAS-cim = src_ip AS src dest_ip AS dest
# No CIM data-model tag applied here — out of A5's explicitly named scope (see ftp_sample note above).
