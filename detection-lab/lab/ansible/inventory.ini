# Static inventory matching the Vagrantfile's private_network IPs.
# Vagrant's own ansible provisioner normally auto-generates an inventory
# per VM, but a static one here makes `ansible-playbook` runnable
# directly (e.g. re-running just the Splunk UF configuration steps
# without a full `vagrant provision`) - keep the IPs in sync with
# ../Vagrantfile if you change them.

[linux_victims]
linux-victim ansible_host=192.168.56.11

[windows_victims]
win-victim ansible_host=192.168.56.12 ansible_connection=winrm ansible_winrm_transport=basic ansible_port=5985 ansible_winrm_server_cert_validation=ignore

[attackers]
attacker ansible_host=192.168.56.13

[all:vars]
ansible_user=vagrant
