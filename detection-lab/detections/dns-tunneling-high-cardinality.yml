title: DNS Tunneling via High-Cardinality Subdomains
id: c26f238c-01b7-49f5-ac6c-a65b4bd3f0bd
status: experimental
description: >
  Flags a source host issuing an unusually large number of distinct,
  long subdomain labels against a single parent domain within a short
  window - the network-level signature of DNS tunneling, where each
  query encodes a chunk of payload into a unique subdomain rather than
  repeating a small, cacheable set of human-readable names. Expressed
  as a Sigma `value_count` correlation over dns-query-event.yml's base
  rule, counting distinct `query` values per `src_ip` within a 1-hour
  window - grouping further by parent domain, and the accompanying
  mean-subdomain-length check, aren't expressible as native Sigma
  fields (they're derived at query time via a `rex` extraction, not
  present on the raw event), so both stay applied at the SPL-translation
  layer only, same as this rule's own SPL block documents. An earlier
  version of this rule used a deprecated pipe-aggregation condition
  (`selection | count(distinct(query)) by src_ip, parent_domain > 15`)
  that pySigma rejects outright (confirmed directly via `sigma check`);
  this version is the corrected native-Sigma equivalent for the
  src_ip-only half of that threshold. Raw domain length alone (Project
  1's original ad-hoc query) is deliberately not used as the sole
  signal, since it over-fires on legitimate long-but-ordinary
  subdomains from CDN edge nodes and reputation/AV lookup services.
  Traces back to Project 1's investigative lead - repeated long,
  base32/base64-looking subdomains from a single host, 192.168.204.71,
  to a single domain, auth.rssfeeds.com - formally worked through in
  the linked investigation below. Not yet promoted to a scheduled
  Splunk alert: see that investigation for the pending query results
  this detection's thresholds are meant to be validated against.
references:
  - https://github.com/sumitjha7727/splunk-log-analysis/tree/main/01-dns-log-analysis/investigation
author: Sumit Kant Jha
date: 2026-08-30
correlation:
  type: value_count
  rules:
    - 9bd8115c-df60-4893-99b1-5ec6fd00bdb4
  group-by:
    - src_ip
  timespan: 1h
  condition:
    field: query
    gte: 15
falsepositives:
  - Reputation/AV lookup services generating high subdomain churn against a single parent domain (e.g. McAfee GTI, Sophos XL, Spamhaus, SORBS)
  - Per-object CDN hostnames, where each cached asset or edge node gets its own long, varied subdomain under one parent domain
  - A legitimate dynamic-DNS or IoT device-provisioning service that issues unique per-device subdomains under one parent domain
level: medium
tags:
  - attack.exfiltration
  - attack.command_and_control
  - attack.t1071.004
  - attack.t1048.003
