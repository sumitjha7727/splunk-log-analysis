# indexes.conf — retention override for the `main` index.
#
# Splunk's default frozenTimePeriodInSecs is 188697600 (~6 years), and
# this app defines no coldToFrozenDir, so a bucket older than that
# gets DELETED, not archived, the next time the indexer's periodic
# freeze-eligibility check runs. This dataset is the MACCDC 2012
# capture — as of 2026 that's roughly 14 years old, well past the
# default window. Discovered the hard way during the 2026-09-18
# RUNBOOK verification pass: dns_sample/dhcp_sample/ssh_sample/
# smtp_sample/ftp_sample/http_sample were re-ingested successfully,
# confirmed correct, then silently deleted by this exact mechanism
# within minutes, while tunnel_sample (broken timestamp, _time stuck
# at ingestion time) survived only because its _time looked "recent"
# enough to stay inside the default window. Set high enough here that
# a fixed-in-time historical dataset like this one is never eligible
# for time-based freezing.
[main]
frozenTimePeriodInSecs = 3153600000
