# transforms.conf — field extractions and null-queue routing for this
# app's six sourcetypes. Paired with props.conf in this same directory;
# see splunk-app/default/README.md for install steps and background.

# ============================================================
# Shared: drop Zeek's #separator/#fields/#types/#close header and
# footer lines before they're indexed, instead of filtering them out
# per-query with `NOT _raw="#*"` the way Projects 1-6's queries did
# by hand (see 01-dns-log-analysis/README.md). Referenced by every
# sourcetype stanza below via TRANSFORMS-nullqueue in props.conf.
# ============================================================
[null_queue_comment_lines]
REGEX = ^#
DEST_KEY = queue
FORMAT = nullQueue

# ============================================================
# dns_sample — 23-field Bro-2012 dns.log schema (Project 1).
# This MACCDC-2012 capture predates the modern Zeek `rtt` field;
# every column after trans_id sits one position earlier than a
# current Zeek release's dns.log. Field order is the corrected
# 23-field mapping from Project 1's field-extraction bug writeup,
# carried over verbatim. Delimiter-based (tab), converted from an
# earlier REGEX-based version of this same field list on 2026-09-18
# to match the DELIMS approach used for ftp/ssh/tunnel below — every
# column here is a fixed tab-separated position, not variable free
# text, so DELIMS is the simpler, more correct tool; the original
# regex only existed because this stanza was first built via the
# Interactive Field Extractor's Regex mode instead of Delimiter mode.
# Field count verified against every line of the real dns.log via
# `awk -F'\t' '{print NF}' | sort -u` before converting (uniformly 23)
# — never assumed from the regex alone.
# ============================================================
[dns_sample_fields]
DELIMS = "\t"
FIELDS = "ts","uid","src_ip","src_port","dest_ip","dest_port","proto","trans_id","query","qclass","qclass_name","qtype","qtype_name","rcode","rcode_name","AA","TC","RD","RA","Z","answers","TTLs","rejected"

# ============================================================
# ftp_sample — 19-field ftp.log schema (Project 2). Project 2's own
# Splunk instance actually indexed this under the built-in sourcetype
# `ftp.logs` (Splunk's classic Add Data wizard silently overrode the
# custom name typed into the upload dialog with one of its own bundled
# definitions - see 02-ftp-log-analysis/README.md, Bug #1). Deploying
# via this props.conf/transforms.conf pair instead of the interactive
# wizard sidesteps that bug: a sourcetype defined directly in
# configuration is used as-is, it isn't subject to the wizard's
# built-in-sourcetype auto-matching. Delimiter-based (tab), same
# method as the Interactive Field Extractor used originally - no
# regex needed since every column is a fixed position, not variable
# free text.
# ============================================================
[ftp_sample_fields]
DELIMS = "\t"
FIELDS = "ts","uid","src_ip","src_port","dest_ip","dest_port","user","password","command","arg","mime_type","file_size","reply_code","reply_msg","passive","data_orig_h","data_resp_h","data_resp_p","fuid"

# ============================================================
# ssh_sample — 11 named fields (Project 3) plus 4 trailing columns
# Project 3 confirmed are consistently empty (`-`) in this dataset
# (Splunk auto-named these field12-field15; kept here under the same
# names for continuity with the original project's field sidebar,
# even though they carry no data in this capture).
# ============================================================
[ssh_sample_fields]
DELIMS = "\t"
FIELDS = "ts","uid","src_ip","src_port","dest_ip","dest_port","status","direction","client","server","resp_size","field12","field13","field14","field15"

# ============================================================
# tunnel_sample — 8-field tunnel.log schema (Project 4).
# ============================================================
[tunnel_sample_fields]
DELIMS = "\t"
FIELDS = "ts","uid","src_ip","src_port","dest_ip","dest_port","tunnel_type","action"

# ============================================================
# smtp_sample — 25-field smtp.log schema (Project 5). Field order
# carried over verbatim from the manual Inline extraction that
# replaced a wizard-based one which silently mis-mapped 13 of 25
# columns on this wide schema (see 05-smtp-log-analysis/README.md) -
# the exact failure mode a one-paste field mapping like this one is
# meant to avoid. Delimiter-based (tab), converted from an earlier
# REGEX-based version of this same field list on 2026-09-18 — see the
# dns_sample note above for why DELIMS is the better fit here.
# Field count verified against every real line of smtp.log (uniformly
# 25) before converting, same as dns_sample.
# ============================================================
[smtp_sample_fields]
DELIMS = "\t"
FIELDS = "ts","uid","src_ip","src_port","dest_ip","dest_port","trans_depth","helo","mailfrom","rcptto","date","from","to","cc","reply_to","msg_id","in_reply_to","subject","x_originating_ip","first_received","last_reply","path","user_agent","fuids","is_webmail"

# ============================================================
# dhcp_sample — 10-field Bro-2012 dhcp.log schema (Project 6). Field
# order carried over verbatim from the manual Inline extraction. This
# extraction alone does not fix Project 6's line-breaking undercount
# (744 of 1,502 real records for the top host, vs. 41 visible in
# Splunk) - that fix is LINE_BREAKER/SHOULD_LINEMERGE in props.conf,
# which determines event boundaries before this field extraction ever
# runs against a given event. Delimiter-based (tab), converted from
# an earlier REGEX-based version of this same field list on
# 2026-09-18 — see the dns_sample note above for why. Field count
# verified against every real line of dhcp.log (uniformly 10) before
# converting.
# ============================================================
[dhcp_sample_fields]
DELIMS = "\t"
FIELDS = "ts","uid","src_ip","src_port","dest_ip","dest_port","mac","assigned_ip","lease_time","trans_id"

# ============================================================
# http_sample — 27-field Bro-2012 http.log schema (Project 8).
# Field order matches Bro 2.x's documented http.log layout, verified
# against this capture's real data before writing this stanza, not
# assumed from generic documentation (the exact lesson dns_sample's
# original bug writeup warns against repeating):
#   - field count confirmed uniformly 27 across every real line
#     (`awk -F'\t' '{print NF}' http.log | sort -u`)
#   - `tags` (field 20) confirmed by content: shows "(empty)" on
#     ordinary requests (Bro's empty-set convention) and
#     "HTTP::URI_SQLI" on requests with attack-signature payloads —
#     a set-type field, not a scalar, and genuinely populated in this
#     data, not a coincidental always-empty column
#   - `resp_fuids`/`resp_mime_types` (fields 26-27) confirmed by
#     content: real Zeek file UIDs (e.g. "FB3BBm49OLiy39Weih") paired
#     with real MIME types (e.g. "text/html") on responses with a
#     body, "-" otherwise
# Delimiter-based (tab), same approach as ftp/ssh/tunnel/dns/smtp/dhcp
# above.
# ============================================================
[http_sample_fields]
DELIMS = "\t"
FIELDS = "ts","uid","src_ip","src_port","dest_ip","dest_port","trans_depth","method","host","uri","referrer","user_agent","request_body_len","response_body_len","status_code","status_msg","info_code","info_msg","filename","tags","username","password","proxied","orig_fuids","orig_mime_types","resp_fuids","resp_mime_types"
