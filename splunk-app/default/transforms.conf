# transforms.conf — field extractions and null-queue routing for this
# app's six sourcetypes. Paired with props.conf in this same directory;
# see splunk-app/default/README.md for install steps and background.

# ============================================================
# Shared: drop Zeek's #separator/#fields/#types/#close header and
# footer lines before they're indexed, instead of filtering them out
# per-query with `NOT _raw="#*"` the way Projects 1-6's queries did
# by hand (see 01-dns-log-analysis/README.md). Referenced by every
# sourcetype stanza below via TRANSFORMS-nullqueue in props.conf.
# ============================================================
[null_queue_comment_lines]
REGEX = ^#
DEST_KEY = queue
FORMAT = nullQueue

# ============================================================
# dns_sample — 23-field Bro-2012 dns.log schema (Project 1).
# This MACCDC-2012 capture predates the modern Zeek `rtt` field;
# every column after trans_id sits one position earlier than a
# current Zeek release's dns.log. Regex is the corrected 23-field
# mapping from Project 1's field-extraction bug writeup, carried
# over verbatim - named capture groups auto-map to field names,
# no FORMAT line needed.
# ============================================================
[dns_sample_fields]
REGEX = ^(?<ts>[^\t]+)\t(?<uid>[^\t]+)\t(?<src_ip>[^\t]+)\t(?<src_port>[^\t]+)\t(?<dest_ip>[^\t]+)\t(?<dest_port>[^\t]+)\t(?<proto>[^\t]+)\t(?<trans_id>[^\t]+)\t(?<query>[^\t]+)\t(?<qclass>[^\t]+)\t(?<qclass_name>[^\t]+)\t(?<qtype>[^\t]+)\t(?<qtype_name>[^\t]+)\t(?<rcode>[^\t]+)\t(?<rcode_name>[^\t]+)\t(?<AA>[^\t]+)\t(?<TC>[^\t]+)\t(?<RD>[^\t]+)\t(?<RA>[^\t]+)\t(?<Z>[^\t]+)\t(?<answers>[^\t]+)\t(?<TTLs>[^\t]+)\t(?<rejected>.+)$

# ============================================================
# ftp_sample — 19-field ftp.log schema (Project 2). Project 2's own
# Splunk instance actually indexed this under the built-in sourcetype
# `ftp.logs` (Splunk's classic Add Data wizard silently overrode the
# custom name typed into the upload dialog with one of its own bundled
# definitions - see 02-ftp-log-analysis/README.md, Bug #1). Deploying
# via this props.conf/transforms.conf pair instead of the interactive
# wizard sidesteps that bug: a sourcetype defined directly in
# configuration is used as-is, it isn't subject to the wizard's
# built-in-sourcetype auto-matching. Delimiter-based (tab), same
# method as the Interactive Field Extractor used originally - no
# regex needed since every column is a fixed position, not variable
# free text.
# ============================================================
[ftp_sample_fields]
DELIMS = "\t"
FIELDS = "ts","uid","src_ip","src_port","dest_ip","dest_port","user","password","command","arg","mime_type","file_size","reply_code","reply_msg","passive","data_orig_h","data_resp_h","data_resp_p","fuid"

# ============================================================
# ssh_sample — 11 named fields (Project 3) plus 4 trailing columns
# Project 3 confirmed are consistently empty (`-`) in this dataset
# (Splunk auto-named these field12-field15; kept here under the same
# names for continuity with the original project's field sidebar,
# even though they carry no data in this capture).
# ============================================================
[ssh_sample_fields]
DELIMS = "\t"
FIELDS = "ts","uid","src_ip","src_port","dest_ip","dest_port","status","direction","client","server","resp_size","field12","field13","field14","field15"

# ============================================================
# tunnel_sample — 8-field tunnel.log schema (Project 4).
# ============================================================
[tunnel_sample_fields]
DELIMS = "\t"
FIELDS = "ts","uid","src_ip","src_port","dest_ip","dest_port","tunnel_type","action"

# ============================================================
# smtp_sample — 25-field smtp.log schema (Project 5). Regex carried
# over verbatim from the manual Inline extraction that replaced a
# wizard-based one which silently mis-mapped 13 of 25 columns on this
# wide schema (see 05-smtp-log-analysis/README.md) - the exact
# failure mode a one-paste regex mapping like this one is meant to
# avoid.
# ============================================================
[smtp_sample_fields]
REGEX = ^(?<ts>[^\t]+)\t(?<uid>[^\t]+)\t(?<src_ip>[^\t]+)\t(?<src_port>[^\t]+)\t(?<dest_ip>[^\t]+)\t(?<dest_port>[^\t]+)\t(?<trans_depth>[^\t]+)\t(?<helo>[^\t]+)\t(?<mailfrom>[^\t]+)\t(?<rcptto>[^\t]+)\t(?<date>[^\t]+)\t(?<from>[^\t]+)\t(?<to>[^\t]+)\t(?<cc>[^\t]+)\t(?<reply_to>[^\t]+)\t(?<msg_id>[^\t]+)\t(?<in_reply_to>[^\t]+)\t(?<subject>[^\t]+)\t(?<x_originating_ip>[^\t]+)\t(?<first_received>[^\t]+)\t(?<last_reply>[^\t]+)\t(?<path>[^\t]+)\t(?<user_agent>[^\t]+)\t(?<fuids>[^\t]+)\t(?<is_webmail>.+)$

# ============================================================
# dhcp_sample — 10-field Bro-2012 dhcp.log schema (Project 6). Regex
# carried over verbatim from the manual Inline extraction. This
# extraction alone does not fix Project 6's line-breaking undercount
# (744 of 1,502 real records for the top host, vs. 41 visible in
# Splunk) - that fix is LINE_BREAKER/SHOULD_LINEMERGE in props.conf,
# which determines event boundaries before this field extraction ever
# runs against a given event.
# ============================================================
[dhcp_sample_fields]
REGEX = ^(?<ts>[^\t]+)\t(?<uid>[^\t]+)\t(?<src_ip>[^\t]+)\t(?<src_port>[^\t]+)\t(?<dest_ip>[^\t]+)\t(?<dest_port>[^\t]+)\t(?<mac>[^\t]+)\t(?<assigned_ip>[^\t]+)\t(?<lease_time>[^\t]+)\t(?<trans_id>.+)$
