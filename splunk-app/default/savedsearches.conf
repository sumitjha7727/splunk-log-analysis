# savedsearches.conf — generated from the Sigma rules in
# 07-detection-as-code/ and their hand-translated SPL as documented in
# 07-detection-as-code/README.md. DO NOT HAND-EDIT THIS FILE. If a
# detection's SPL, schedule, or threshold changes, change it in the
# Sigma rule and the corresponding README section first, then
# regenerate this file to match - otherwise this file and the
# documentation it's supposed to implement will silently drift apart,
# which is exactly the bug A1 fixed for the search-window mismatch.
#
# Nine stanzas below for nine documented detections (one per detection
# row in 07-detection-as-code/README.md). Only the first three are live
# scheduled alerts; the rest are documented findings, deliberately
# unscheduled and disabled, each with a description explaining why - a
# static 2012 capture has nothing new for a schedule to catch.

[SSH Brute Force Followed by Success]
search = index=main sourcetype="ssh_sample" earliest=-1h latest=now | sort 0 _time | streamstats count(eval(status="failure")) as fails_before by src_ip, dest_ip | where status="success" AND fails_before > 5 | stats max(fails_before) as failures_before_success, count as successes_after_failures, min(_time) as first_success by src_ip, dest_ip | eval first_success=strftime(first_success,"%Y-%m-%d %H:%M:%S") | sort - failures_before_success
description = Sigma: ssh-bruteforce-then-success.yml. Fires when a source/destination pair records a successful SSH login after more than 5 failed logins (order enforced with streamstats), within the same 1-hour window as the correlation rule's declared timespan. Validated over the full static capture with earliest=0 (11 pairs, including both Project 3 headline pairs); in its real hourly window it returns 0 rows because the capture is 2012 data - the logic is validated, the schedule cannot fire on this dataset.
enableSched = 1
cron_schedule = 0 * * * *
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 4
alert.suppress = 1
alert.suppress.period = 86400
alert.suppress.fields = src_ip,dest_ip
alert.track = 1
disabled = 0

[SMTP Nmap Scan Signature (HELO Fingerprint)]
search = index=main sourcetype="smtp_sample" earliest=-1h latest=now helo="*nmap*"
description = Sigma: nmap-scan-signature.yml. Fires on Nmap's SMTP script HELO fingerprint (nmap.scanme.org). No correlation window to match; hourly is a reasonable default cadence.
enableSched = 1
cron_schedule = 0 * * * *
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 3
alert.track = 1
disabled = 0

[SMTP Nessus Scan Signature (HELO Fingerprint)]
search = index=main sourcetype="smtp_sample" earliest=-1h latest=now helo="*nessus*"
description = Sigma: nessus-scan-signature.yml. Fires on Nessus's SMTP HELO fingerprint strings (mail.nessus.org, bare nessus).
enableSched = 1
cron_schedule = 0 * * * *
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 3
alert.track = 1
disabled = 0

[SMTP Command-Injection Probe in Envelope Fields]
search = index=main sourcetype="smtp_sample" earliest=0 (rcptto="*|*" OR rcptto="*;*" OR rcptto="*\"*" OR mailfrom="*|*" OR mailfrom="*;*")
description = Sigma: smtp-injection-probe.yml. Documented finding, not yet a live alert - the underlying finding was a fixed set of 11 events in a static capture, nothing left for a schedule to catch going forward. See 07-detection-as-code/README.md, detection 4.
enableSched = 0
disabled = 1

[DHCP Lease Pool Dominated by a Single Host]
search = index=main sourcetype="dhcp_sample" earliest=0 | stats count by mac | where count > 100
description = Sigma: dhcp-lease-anomaly.yml. Informational only, deliberately unscheduled. Threshold recalibrated 2026-09-18 from >20 to >100 on the corrected data: >20 flagged 9 of 87 MACs, >100 isolates exactly the one dominant host (744 of 1,502 records). See 07-detection-as-code/README.md, detection 5.
enableSched = 0
disabled = 1

[DNS Tunneling via High-Cardinality Subdomains]
search = index=main sourcetype="dns_sample" earliest=0 | rex field=query "(?<subdomain>^[^.]+)\.(?<parent_domain>.+)$" | eval subdomain_length=len(subdomain) | stats dc(query) as unique_subdomains, avg(subdomain_length) as mean_subdomain_length, count as total_queries by src_ip, parent_domain | where unique_subdomains > 15 AND mean_subdomain_length > 35
description = Sigma: dns-tunneling-high-cardinality.yml. Pending investigation results - thresholds (15, 35) are placeholders, not yet validated. See RUNBOOK.md, 01-dns-log-analysis/investigation/INVESTIGATION.md, and 07-detection-as-code/README.md detection 6.
enableSched = 0
disabled = 1

[HTTP Web Scanner or Directory Brute-Forcer User-Agent]
search = index=main sourcetype="http_sample" earliest=0 user_agent IN ("*DirBuster*", "*Nikto*", "*Nmap Scripting Engine*", "*Nessus*") | stats count as requests, dc(dest_ip) as targets by src_ip | sort - requests
description = Sigma: http-scanner-user-agent.yml. Documented finding, not a live alert - the underlying finding is a fixed set of 1,315,522 requests in a static 2012 capture (Project 8), nothing left for a schedule to catch, so earliest=0 is kept deliberately. See 07-detection-as-code/README.md, detection 7.
enableSched = 0
disabled = 1

[HTTP SQL Injection Signature Tag]
search = index=main sourcetype="http_sample" earliest=0 tags="*HTTP::URI_SQLI*" | stats count as requests, count(eval(status_code=200)) as ok_200, dc(dest_ip) as targets by src_ip | sort - requests
description = Sigma: http-sqli-signature-tag.yml. Documented finding, not a live alert - 2,731 tagged requests in a static 2012 capture (Project 8), so earliest=0 is kept deliberately. See 07-detection-as-code/README.md, detection 8.
enableSched = 0
disabled = 1

[VMware ESX SDK Directory Traversal Probe]
search = index=main sourcetype="http_sample" earliest=0 uri="*/sdk/*" uri="*/../*" uri="*vmware*" | stats count as requests, dc(dest_ip) as targets, count(eval(status_code=200)) as ok_200 by src_ip, user_agent | sort - requests
description = Sigma: http-vmware-sdk-path-traversal.yml. Documented finding, not a live alert - 97 requests in a static 2012 capture (Project 8), so earliest=0 is kept deliberately. See 07-detection-as-code/README.md, detection 9.
enableSched = 0
disabled = 1
