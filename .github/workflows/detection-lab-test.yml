name: Fixture replay tests (detection-lab)

on:
  push:
    paths:
      - "detection-lab/**"
  pull_request:
    paths:
      - "detection-lab/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest pyyaml

      - name: Run fixture replay tests
        run: pytest detection-lab/tests/test_detections.py -v