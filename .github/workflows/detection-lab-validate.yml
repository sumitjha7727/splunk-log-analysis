name: Validate Sigma rules (detection-lab)

on:
  push:
    paths:
      - "detection-lab/detections/**"
  pull_request:
    paths:
      - "detection-lab/detections/**"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install sigma-cli
        run: pip install sigma-cli pysigma-backend-splunk

      - name: sigma check — lint every rule for schema correctness
        run: sigma check detection-lab/detections/