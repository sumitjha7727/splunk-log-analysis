title: SSH Brute Force Followed by Successful Login
id: a3842500-5738-4255-bd95-6dcba6f5decc
status: experimental
description: >
  Fires when a source/destination pair that triggered the high-volume
  failed-login rule is then followed by a successful login from the
  same pair, within the correlation window. This is the actual
  "attacker got in" signature - matches the brute-force-to-success
  pattern found in Project 3 (Query 3): 192.168.204.45 ->
  192.168.28.203 logged 95 failures and 1 success (the success came
  after 12 failures, at 2012-03-16 14:50:12), and 192.168.204.45 ->
  192.168.21.253 logged 57 failures and 1 success (also after 12).
references:
  - https://github.com/sumitjha7727/splunk-log-analysis/tree/main/03-ssh-log-analysis
author: Sumit Kant Jha
date: 2026-08-28
correlation:
  type: temporal_ordered
  rules:
    - 7f3a1e2c-4b6d-4a9f-9c1e-2d5f8a7b3c10
    - 51eadaf4-70f2-44ca-9f2b-73b772f5af52
  group-by:
    - src_ip
    - dest_ip
  timespan: 1h
falsepositives:
  - A legitimate user who mistypes their password several times before succeeding
  - Automated retry logic in a monitoring or config-management tool that eventually authenticates successfully
level: high
tags:
  - attack.credential-access
  - attack.initial-access
  - attack.t1110
  - attack.t1078
